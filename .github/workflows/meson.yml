name: Meson Build

env:
  R2V: 6.2.2

on:
  push:
  workflow_dispatch: {}

jobs:
  build:
    name: Build with meson and r2 plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build deps
        run: sudo apt-get update -y && sudo apt-get install -y build-essential meson ninja-build pkg-config

      - name: Install radare2
        id: r2
        uses: radareorg/github-actions@4ae27a8b29a049ac0fd5119f6eda37ecfc64ead8 # v3
        with:
          version: ${{ env.R2V }}

      - name: Build library and r2 plugin with meson
        run: meson setup builddir && meson compile -C builddir
